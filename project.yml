name: Clockin
options:
  bundleIdPrefix: com.moha
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TWG8JGKXSA
    # The one place the App Group id lives: both entitlements and SharedStore read it.
    APP_GROUP_ID: group.com.moha.clockin
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Copy lives in Shared/Localizable.xcstrings; builds add new strings to it.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Clockin:
    type: application
    platform: iOS
    sources:
      - Clockin
      - Shared
    entitlements:
      path: Clockin/Clockin.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Lets the end alert break through Focus. Needs a paid Apple Developer
        # Program team (free Personal Teams can't sign it), so it's off for now.
        # com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Clockin/Info.plist
      properties:
        CFBundleDisplayName: Clockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClockinAppGroup: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Paper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.moha.clockin
            CFBundleURLSchemes: [clockin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha.clockin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: BurntOrange
    dependencies:
      - target: ClockinWidgets
  ClockinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ClockinWidgets
      - Shared
      - path: Clockin/Assets.xcassets
        buildPhase: resources
    entitlements:
      path: ClockinWidgets/ClockinWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    info:
      path: ClockinWidgets/Info.plist
      properties:
        CFBundleDisplayName: Clockin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClockinAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha.clockin.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  ClockinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClockinTests
    dependencies:
      - target: Clockin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha.clockin.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clockin:
    build:
      targets:
        Clockin: all
        ClockinTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClockinTests
